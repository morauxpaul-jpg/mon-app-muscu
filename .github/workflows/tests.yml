# Barrière avant déploiement.
#
# Railway déploie automatiquement depuis `main`. Sans ce garde-fou, les 337
# tests ne protègent que celui qui pense à les lancer — et quatre défauts ont
# atteint l'utilisateur en trois jours faute de les exécuter au bon moment.
#
# « Wait for CI » est actif dans Railway (constaté à l'audit du 06/10) : un
# commit dont ces tests ÉCHOUENT n'est pas déployé. Mais un job ANNULÉ (délai
# dépassé) n'est pas un échec pour Railway : le 23/10, le commit 07a1987 a été
# déployé alors que ses tests avaient été coupés à 10 min (audit du 28/10,
# I-1). D'où le job « verdict » en fin de fichier.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Un push qui en remplace un autre annule le job devenu inutile.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python + JavaScript
    runs-on: ubuntu-latest
    # Les tests prennent ~4 min ; c'est l'installation des paquets système de
    # Chromium (apt) qui varie : elle a dépassé 9 min les 22 et 23/10, et la
    # limite de 10 min coupait le job avant le premier test (main non testé,
    # déploiement Railway parti quand même).
    timeout-minutes: 20

    # Un vrai Redis : la suite est rejouée dessus (état partagé entre
    # instances, core/partage.py), comme en production à plusieurs processus.
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      # Un vrai PostgreSQL, de la version de production : toutes les
      # migrations du dépôt y sont rejouées, deux fois, et chaque colonne lue
      # par le code doit exister (tests/test_migrations_postgres.py). La
      # fausse base des tests, elle, ne connaît que ce qu'on lui dit : la v29
      # est restée des mois hors de la production (audit du 06/10, I-4).
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      # La version doit être celle de la production (runtime.txt), sinon on
      # teste autre chose que ce qui tourne.
      - name: Vérifie l'accord avec runtime.txt
        run: |
          prod=$(sed 's/^python-//' runtime.txt | cut -d. -f1,2)
          if [ "$prod" != "3.11" ]; then
            echo "runtime.txt annonce Python $prod, ce workflow teste 3.11."
            echo "Mettre les deux d'accord avant de continuer."
            exit 1
          fi

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      # requirements.txt EXACTEMENT comme en production : si une dépendance y
      # manque, le job échoue ici plutôt qu'au démarrage du serveur.
      - name: Dépendances de production
        run: pip install -r requirements.txt

      # Le seul moment où l'app est seule avec ses dépendances réelles. Les
      # outils (Pillow) arrivent APRÈS : un `from PIL import Image` glissant
      # dans une route passerait les tests et planterait le serveur.
      - name: L'app démarre avec elles seules
        working-directory: pwa
        run: python -c "import app"

      - name: Dépendances des tests et des outils
        run: pip install -r requirements-dev.txt

      # Chromium pour pwa/tests/e2e : la séance jouée comme un utilisateur.
      # Sans lui, ces tests s'ignoreraient — et c'est précisément ce qu'aucun
      # test par route n'avait vu (séries cochées puis effacées, audit du 30/09).
      - name: Navigateur des tests de parcours
        run: python -m playwright install --with-deps chromium

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Tests Python
        working-directory: pwa
        env:
          PG_TEST_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: python -m pytest tests -q

      # Même suite, cache, verrous, quotas et tâches IA rangés dans Redis :
      # ce que voit l'app avec REDIS_URL et plusieurs instances. Les tests
      # navigateur, qui lancent leur propre serveur, ne changent pas.
      - name: Tests Python sur Redis
        working-directory: pwa
        env:
          PARTAGE_TEST: redis://localhost:6379/0
          REDIS_TEST_URL: redis://localhost:6379/1
        run: python -m pytest tests -q --ignore=tests/e2e

      # tests/test_js.py lance déjà cette suite, mais il s'IGNORE si Node est
      # absent. Une étape dédiée garantit qu'un silence ne passe pas pour un
      # succès.
      - name: Tests JavaScript
        working-directory: pwa
        run: node tests/js/run.js

  # La barrière elle-même. Railway ne bloque qu'un échec : un job annulé (délai
  # dépassé, runner perdu) ou ignoré laissait passer le commit sans un seul
  # test. Ce job tourne quoi qu'il arrive et échoue si les tests n'ont pas
  # RÉUSSI ; son échec est vu par Railway comme celui des tests.
  verdict:
    name: Verdict
    needs: [tests]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Les tests ont-ils réussi ?
        env:
          RESULTAT: ${{ needs.tests.result }}
        run: |
          echo "Tests : $RESULTAT"
          if [ "$RESULTAT" != "success" ]; then
            echo "Les tests n'ont pas réussi ($RESULTAT) : ce commit ne doit pas être déployé."
            exit 1
          fi
