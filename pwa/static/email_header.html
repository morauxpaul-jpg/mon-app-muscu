<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1200px; height:480px; overflow:hidden; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background:
      radial-gradient(130% 150% at 85% 15%, rgba(120,200,255,0.26) 0%, rgba(120,200,255,0.06) 38%, rgba(10,10,15,0) 62%),
      radial-gradient(90% 130% at 0% 110%, rgba(120,200,255,0.10) 0%, rgba(10,10,15,0) 55%),
      #0a0a0f;
    position:relative; display:flex; flex-direction:column; justify-content:center;
    align-items:flex-start;
    padding:0 70px;
  }
  .brand { display:flex; align-items:center; gap:20px; margin-bottom:26px; }
  .icon { width:84px; height:84px; border-radius:22px; box-shadow:0 10px 34px rgba(0,0,0,.5), 0 0 26px rgba(120,200,255,.18); }
  .brandname { font-size:30px; font-weight:800; color:#fff; letter-spacing:-0.5px; }
  .kicker { font-size:22px; font-weight:700; color:#78c8ff; letter-spacing:2px; text-transform:uppercase; margin-bottom:10px; }
  .head { font-size:62px; font-weight:800; color:#fff; line-height:1.02; letter-spacing:-1.5px; }
  .head .robot { font-size:54px; }
  .badge {
    display:inline-block; margin-top:24px; font-size:20px; font-weight:700; color:#0a0a0f;
    background:linear-gradient(135deg,#a0dbff,#78c8ff); padding:10px 22px; border-radius:999px;
    box-shadow:0 0 28px rgba(120,200,255,.35);
  }
</style>
</head>
<body>
  <div class="brand">
    <img class="icon" src="icon-512.png" alt="">
    <span class="brandname">Muscu Tracker</span>
  </div>
  <div class="kicker">Grande nouvelle</div>
  <div class="head">Bientôt sur<br>Android <span class="robot">🤖</span></div>
  <span class="badge">Deviens testeur en avant-première 💪</span>
</body>
</html>
