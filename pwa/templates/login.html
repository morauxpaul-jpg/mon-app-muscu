<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0f">
  <title>Connexion · Muscu Tracker</title>
  <link rel="icon" type="image/png" sizes="192x192" href="/static/icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="/static/icon-512.png">
  <link rel="stylesheet" href="/static/css/tokens.css">
  <link rel="stylesheet" href="/static/css/theme.css">
  <link rel="stylesheet" href="/static/css/components.css">
  <link rel="stylesheet" href="/static/css/icons.css">
  <link rel="stylesheet" href="/static/css/glass.css">
  <style>
    .login-wrap {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .login-logo { width: 96px; height: 96px; border-radius: 24px; margin-bottom: 16px; }
    .login-title { font-size: 1.6rem; margin: 0 0 6px 0; }
    .login-sub { color: var(--text-2); margin-bottom: 28px; font-size: 0.95rem; }
    .google-btn {
      display: inline-flex; align-items: center; gap: 10px;
      padding: 12px 24px; font-size: 1rem; font-weight: 600;
      border-radius: var(--radius-pill); cursor: pointer;
      background: rgba(120,200,255,0.15);
      border: 1px solid rgba(120,200,255,0.25); color: var(--accent);
      box-shadow: 0 0 24px rgba(120,200,255,0.10), inset 0 0.5px 0 rgba(255,255,255,0.10);
      transition: all var(--ease-normal);
    }
    .google-btn:hover { background: rgba(120,200,255,0.22); border-color: rgba(120,200,255,0.35); box-shadow: 0 0 32px rgba(120,200,255,0.15); transform: translateY(-1px); }
    .err { color: var(--danger); margin-top: 14px; font-size: 0.85rem; }
  </style>
</head>
<body>
  <div class="login-wrap">
    <img src="/static/icon-192.png" alt="Muscu Tracker" class="login-logo">
    <h1 class="app-logo">Muscu Tracker</h1>
    <div class="login-sub">Connecte-toi pour retrouver ton programme et ton historique.</div>
    <button id="google" class="google-btn"><svg class="icon icon-sm"><use href="/static/img/icons.svg#lock"/></svg>Continuer avec Google</button>
    <div id="err" class="err"></div>
  </div>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
    const SUPABASE_URL = {{ supabase_url|tojson }};
    const SUPABASE_ANON = {{ supabase_anon|tojson }};
    const GOOGLE_WEB_CLIENT_ID = {{ google_web_client_id|tojson }};
    const errEl = document.getElementById('err');

    if (!SUPABASE_URL || !SUPABASE_ANON) {
      errEl.textContent = "Config Supabase manquante côté serveur.";
    }

    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON, {
      auth: { flowType: 'pkce', persistSession: true, detectSessionInUrl: true }
    });

    // Dans l'app native Capacitor, l'OAuth Google en webview est interdit
    // (403 disallowed_useragent). On bascule alors sur le Google Sign-In NATIF
    // (plugin @capgo/capacitor-social-login) → idToken → signInWithIdToken.
    // Sur le web/PWA, `Capacitor` est absent → flux OAuth classique inchangé.
    const isNative = !!(window.Capacitor
      && typeof window.Capacitor.isNativePlatform === 'function'
      && window.Capacitor.isNativePlatform());

    // ── Nonce sécurisé : digest SHA-256 → Google, brut → Supabase ──
    function randHex(n) {
      const a = new Uint8Array(n);
      crypto.getRandomValues(a);
      return Array.from(a, b => b.toString(16).padStart(2, '0')).join('');
    }
    async function sha256Hex(msg) {
      const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(msg));
      return Array.from(new Uint8Array(buf), b => b.toString(16).padStart(2, '0')).join('');
    }

    async function nativeGoogleLogin() {
      const SocialLogin = window.Capacitor?.Plugins?.SocialLogin;
      if (!SocialLogin) { errEl.textContent = "Plugin de connexion natif indisponible."; return; }
      if (!GOOGLE_WEB_CLIENT_ID) { errEl.textContent = "Connexion native non configurée."; return; }

      await SocialLogin.initialize({
        google: { webClientId: GOOGLE_WEB_CLIENT_ID, mode: 'online' }
      });

      const rawNonce = randHex(32);
      const nonceDigest = await sha256Hex(rawNonce);
      // Pas de `scopes` custom : le plugin inclut déjà email/profil/openid par
      // défaut via Credential Manager. Passer des scopes personnalisés
      // exigerait de modifier la MainActivity native (cf. GoogleProvider.java).
      const res = await SocialLogin.login({
        provider: 'google',
        options: { nonce: nonceDigest }
      });
      // La forme du retour varie selon la version du plugin.
      const idToken = res?.result?.idToken || res?.idToken;
      if (!idToken) { errEl.textContent = "Aucun jeton Google reçu."; return; }

      const { data, error } = await supabase.auth.signInWithIdToken({
        provider: 'google', token: idToken, nonce: rawNonce
      });
      if (error) { errEl.textContent = error.message; return; }
      const accessToken = data?.session?.access_token;
      if (!accessToken) { errEl.textContent = "Session Supabase introuvable."; return; }

      // Même bridge que le web : on pose la session Flask via /auth/session.
      const r = await fetch('/auth/session', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'same-origin',
        body: JSON.stringify({ access_token: accessToken })
      });
      if (!r.ok) {
        const j = await r.json().catch(() => ({}));
        errEl.textContent = "Erreur : " + (j.error || r.status);
        return;
      }
      window.location.replace('/accueil');
    }

    async function webGoogleLogin() {
      const { error } = await supabase.auth.signInWithOAuth({
        provider: 'google',
        options: { redirectTo: window.location.origin + '/auth/bridge' }
      });
      if (error) errEl.textContent = error.message;
    }

    document.getElementById('google').addEventListener('click', async () => {
      errEl.textContent = "";
      try {
        await (isNative ? nativeGoogleLogin() : webGoogleLogin());
      } catch (e) {
        errEl.textContent = (e && e.message) ? e.message : "Connexion impossible.";
      }
    });
  </script>
</body>
</html>
